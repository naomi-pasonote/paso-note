      radial-gradient(circle at 8% -5%, rgba(224,67,92,0.07), transparent 45%),
      radial-gradient(circle at 94% 8%, rgba(201,162,39,0.09), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(208,38,74,0.04), transparent 60%);
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  header.app-header{
    position:relative;
    line-height:0;
    border-bottom:1px solid var(--border);
    overflow:hidden;
  }
  .header-banner{
    display:block;
    width:100%;
    height:auto;
  }
  @media (min-width:900px){
    main, .search-wrap, .tabs, .header-row-max{ max-width:1080px; margin:0 auto; }
  }
  @media (min-width:900px) and (max-width:1180px){
    main, .search-wrap, .tabs{ padding-left:32px; padding-right:32px; }
  }

  .search-wrap{
    padding:16px 20px 0;
  }
  .search-input{
    width:100%;
    padding:12px 14px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-primary);
    font-size:15px;
    font-family:inherit;
  }
  .search-input::placeholder{color:var(--text-faint);}
  .search-input:focus{outline:2px solid var(--accent-gold); outline-offset:1px;}

  .tabs{
    display:flex;
    gap:8px;
    padding:16px 20px 4px;
  }
  .tab-btn{
    flex:1;
    padding:12px 8px;
    text-align:center;
    border-radius:var(--radius-pill);
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    font-size:13.5px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    position:relative;
    box-shadow:0 1px 3px rgba(122,31,43,0.05);
  }
  .tab-btn.active{
    color:#fff;
    background:linear-gradient(135deg, var(--accent-rose), var(--accent-bordeaux) 100%);
    border-color:var(--accent-bordeaux);
    box-shadow:0 3px 10px rgba(122,31,43,0.28);
    letter-spacing:0.01em;
  }
  .tab-badge{
    display:inline-block;
    margin-left:5px;
    min-width:18px;
    padding:0 4px;
    border-radius:9px;
    background:var(--accent-gold);
    color:#4A2A2E;
    font-size:11px;
    font-weight:800;
    line-height:18px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.6);
  }
  .tab-btn.active .tab-badge{
    background:#fff;
    color:var(--accent-bordeaux);
  }

  /* レッスン一覧：ヌメロ絞り込み（表示のみ。保存データには影響しません） */
  .lesson-filter-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 12px;
    padding:10px 12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow-card);
  }
  .lesson-filter-label{
    flex:0 0 auto;
    font-size:13px;
    font-weight:700;
    color:var(--text-muted);
  }
  .lesson-filter-select{
    min-width:0;
    flex:1;
    padding:9px 34px 9px 12px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--surface-raised);
    color:var(--text-primary);
    font:inherit;
    font-size:14px;
    cursor:pointer;
  }
  .lesson-filter-select:focus{outline:2px solid var(--accent-gold);outline-offset:1px;}
  .lesson-filter-summary{
    margin:0 0 12px;
    padding:10px 14px;
    border-radius:12px;
    background:rgba(201,162,39,0.10);
    border:1px solid rgba(201,162,39,0.28);
    color:var(--text-primary);
    font-size:14px;
    line-height:1.6;
  }
  @media (max-width:520px){
    .lesson-filter-wrap{align-items:stretch;flex-direction:column;gap:6px;padding:9px 10px;}
    .lesson-filter-select{width:100%;}
  }

  main{padding:16px 20px 20px;}

  .empty-state{
    text-align:center;
    padding:48px 16px;
    color:var(--text-muted);
  }
  .empty-state .big{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:20px;
    color:var(--text-primary);
    margin-bottom:8px;
  }

  /* Issue board */
  .issue-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left-width:8px;
    border-left-style:solid;
    border-left-color:var(--border);
    border-radius:var(--radius);
    padding:8px 12px 7px;
    margin-bottom:6px;
    box-shadow:var(--shadow-card);
  }
  .issue-meta{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:11.5px;
    color:var(--text-faint);
    margin-bottom:4px;
    font-family:'JetBrains Mono',monospace;
  }
  .issue-lesson-name{color:var(--accent-gold);}
  .issue-text{
    font-size:15px;
    line-height:1.5;
    margin:0 0 6px;
  }
  .issue-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .note-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left-width:8px;
    border-left-style:solid;
    border-left-color:var(--accent-gold);
    border-radius:var(--radius);
    padding:8px 12px 7px;
    margin-bottom:6px;
    box-shadow:var(--shadow-card);
  }
  .note-date{
    font-size:11.5px;
    color:var(--text-faint);
    margin-bottom:4px;
    font-family:'JetBrains Mono',monospace;
  }
  .note-text{
    font-size:15px;
    line-height:1.6;
    margin:0 0 6px;
    white-space:pre-wrap;
  }
  .note-actions{display:flex; gap:14px;}

  .btn{
    border:none;
    border-radius:var(--radius-pill);
    padding:10px 16px;
    font-size:13px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .btn-ghost{background:var(--surface-raised); color:var(--accent-bordeaux); border:1px solid var(--border);}
  .btn-ghost:active{background:var(--surface-hover);}
  .btn-gold{background:var(--accent-gold-soft); color:#7A5C10; border:1px solid rgba(201,162,39,0.55);}
  .btn-red{background:var(--accent-red-soft); color:#9C1F3B; border:1px solid rgba(208,38,74,0.4);}
  .btn-solid-red{background:linear-gradient(90deg, var(--accent-rose), var(--accent-bordeaux)); color:#fff;}
  .btn-danger-text{background:transparent; color:var(--danger); border:none; text-decoration:underline; padding:6px 4px;}

  /* Lesson cards */
  .lesson-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left-width:8px;
    border-left-style:solid;
    border-left-color:var(--border);
    border-radius:var(--radius);
    margin-bottom:6px;
    overflow:hidden;
    box-shadow:var(--shadow-card);
  }
  .lesson-head{
    padding:9px 13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    cursor:pointer;
  }
  .lesson-head-left{flex:1; min-width:0;}
  .lesson-date{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--accent-gold);
    margin-bottom:3px;
  }
  .lesson-content{
    font-size:16px;
    font-weight:600;
    color:var(--text-primary);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .lesson-sub{
    font-size:12px;
    color:var(--text-muted);
    margin-top:3px;
  }
  .chip{
    display:inline-block;
    padding:3px 10px;
    border-radius:20px;
    font-size:11.5px;
    font-weight:800;
    margin-right:6px;
    letter-spacing:0.01em;
  }
  .chip-open{background:var(--accent-red-soft); color:#8A4A54;}
  .chip-clear{background:rgba(107,143,94,0.14); color:#5A7A4E;}
  .chevron{
    color:var(--text-faint);
    font-size:18px;
    transition:transform 0.15s ease;
    flex-shrink:0;
  }
  .chevron.open{transform:rotate(90deg);}

  .lesson-body{
    padding:0 13px 9px;
    border-top:1px solid var(--border-soft);
  }
  .section{
    margin-top:8px;
  }
  .section-label{
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    font-weight:700;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:6px;
  }

  .yt-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--accent-gold);
    font-size:13.5px;
    text-decoration:none;
    font-weight:600;
    word-break:break-all;
  }

  .chapter-row, .issue-row, .log-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    padding:5px 8px;
    background:var(--surface-raised);
    border-radius:12px;
    margin-bottom:3px;
  }
  .chapter-row{cursor:pointer;}
  .chapter-row:active{background:var(--surface-hover);}
  .chapter-time{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--accent-gold);
    flex-shrink:0;
    min-width:44px;
  }
  .chapter-label, .issue-row-text, .log-note{
    font-size:13.5px;
    flex:1;
    line-height:1.4;
  }
  .issue-row.resolved .issue-row-text{color:var(--text-faint); text-decoration:line-through;}
  .row-del{
    background:none;
    border:none;
    color:var(--text-faint);
    font-size:16px;
    padding:0 2px;
    cursor:pointer;
    flex-shrink:0;
  }
  .checkbox{
    width:18px; height:18px;
    border-radius:5px;
    border:1.5px solid var(--accent-gold);
    flex-shrink:0;
    margin-top:1px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
  }
  .checkbox.checked{background:var(--accent-gold); border-color:var(--accent-gold);}
  .checkbox.checked::after{content:"✓"; color:#fff; font-size:12px; font-weight:900;}

  .log-date{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
    margin-bottom:2px;
  }

  .add-row{
    display:flex;
    gap:6px;
    margin-top:6px;
  }
  .add-row input, .add-row textarea{
    flex:1;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--text-primary);
    padding:8px 10px;
    font-size:13.5px;
    font-family:inherit;
  }
  .add-row input.time-input{flex:0 0 64px;}
  .add-row button{flex-shrink:0;}

  textarea.goals-input{
    width:100%;
    min-height:56px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--text-primary);
    padding:10px;
    font-size:13.5px;
    font-family:inherit;
    resize:vertical;
  }

  .lesson-footer-actions{
    display:flex;
    justify-content:flex-end;
    gap:14px;
    margin-top:6px;
    padding-top:5px;
    border-top:1px solid var(--border-soft);
  }

  .fab{
    position:fixed;
    bottom:20px;
    right:18px;
    width:52px;
    height:52px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--accent-rose), var(--accent-bordeaux) 100%);
    color:#fff;
    font-size:24px;
    border:1.5px solid var(--accent-gold);
    box-shadow:0 4px 14px rgba(122,31,43,0.35), 0 0 0 2px rgba(201,162,39,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:40;
  }
  .fab:active{background:linear-gradient(135deg, var(--accent-bordeaux), var(--accent-rose));}

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(58,32,42,0.42);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .modal-overlay.hidden{display:none;}
  .modal-sheet{
    background:var(--surface);
    border-radius:24px 24px 0 0;
    width:100%;
    max-width:520px;
    max-height:88vh;
    overflow-y:auto;
    padding:20px 20px 28px;
    border-top:2px solid var(--accent-gold);
    box-shadow:0 -6px 18px rgba(138,74,84,0.10);
  }
  .modal-title{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-weight:700;
    font-size:20px;
    margin:0 0 14px;
    color:var(--accent-red);
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11.5px;
    color:var(--text-faint);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:6px;
    font-weight:700;
  }
  .field input, .field textarea, .field select{
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--text-primary);
    padding:11px 12px;
    font-size:15px;
    font-family:inherit;
  }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .modal-actions .btn{flex:1; justify-content:center; padding:12px;}

  .toast{
    position:fixed;
    bottom:96px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--surface-raised);
    border:1px solid var(--border);
    color:var(--text-primary);
    padding:10px 16px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    transition:opacity 0.2s, transform 0.2s;
    z-index:60;
    pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .loading-wrap{
    padding:60px 20px;
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>

<script>
/* ==============================
   Firebase 設定
   ここに Firebase コンソールで取得した設定値を入れます。
   （このファイルはClaudeが値を埋めて再作成します。手動編集は不要です）

const firebaseConfig = {

  authDomain: "naomi-15bec.firebaseapp.com",

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true }).catch(()=>{ /* 対応していない環境では無視 */ });

// レッスンを1件ずつ、別々のドキュメントとして保存します
// （1つの巨大なドキュメントにまとめて保存すると、保存タイミングが重なった時に
//   お互いの内容を上書きしてしまうため、レッスンごとに分けています）
const lessonsCollection = db.collection('flamencoLessons');
// 「フラメンコ全体メモ」用のコレクション（レッスンとは完全に別の場所に保存）
const generalNotesCollection = db.collection('flamencoGeneralNotes');
// 初回だけサンプルデータを入れるための「印」を記録する場所
const metaDocRef = db.collection('flamencoMeta').doc('status');
let unsubscribeSnapshot = null;
let unsubscribeNotesSnapshot = null;
let directIssues = [];
let unsubscribeDirectIssuesSnapshot = null;

let lessons = [];
const directIssuesCollection = db.collection('flamencoDirectIssues');
let generalNotes = [];
let currentTab = 'issues';
let expandedId = null;
let editingLessonId = null;
let editingNoteId = null;
let searchTerm = '';
let lessonNumeroFilter = ''; // レッスン一覧の表示絞り込み専用。Firebaseには保存しない

// ==============================
// ヌメロ（曲種）と色の対応表
// 現在の登録・絞り込み一覧と、過去データ互換用の色定義を分離しています。
// ==============================
const NUMERO_SELECT_OPTIONS = [
  "カンティーニャ",
  "アレグリ・ソロパート",
  "グアヒーラソロ",
  "ファルーカ",
  "ファンタンゴ",
  "セビジャーナス",
  "パルマ",
  "集中パルマ",
  "タンゴ",
  "ブレリア",
  "その他",
];

const NUMERO_COLORS = {
  "集中パルマ":           "#A99BDA",
  "ブレリア":             "#2E806B",
  "カンティーニャ":       "#E5BF45",
  "アレグリ・ソロパート": "#D83E57",
  "グアヒーラソロ":       "#55A9D6",
  "ファルーカ":           "#50545B",
  "ファンタンゴ":         "#B38A32",
  "セビジャーナス":       "#D95D8E",
  "パルマ":               "#8064C9",
  "カーニャ":             "#257E68",
  "その他":               "#91C99B",

  // 過去データ用（選択一覧には出さない）
  "アレグリアス":   "#B62B42",
  "タンゴ":         "#C8C1B8",
  "タラント":       "#5F8627",
  "ロンデーニャ":   "#328539",
  "ソレア":         "#2577B1",
  "ティエント":     "#257E68",
  "カラコレス":     "#964096",
  "グアヒーラ":     "#7436A1",
};
const NUMERO_UNSET_LABEL = '未設定';
const NUMERO_UNSET_COLOR = '#8A8582';

function numeroDisplayLabel(numero){
  return numero === "集中パルマ" ? "🎸 集中パルマ" : numero;
}
function numeroColor(numero){
  return (numero && NUMERO_COLORS[numero]) || NUMERO_UNSET_COLOR;
}
function numeroLabel(numero){
  return numero || NUMERO_UNSET_LABEL;
}
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
}
function numeroChipHtml(numero){
  const color = numeroColor(numero);
  return `<span class="chip" style="background:${hexToRgba(color,0.24)};color:${color};border:1.5px solid ${hexToRgba(color,0.8)};">${escapeHtml(numeroDisplayLabel(numeroLabel(numero)))}</span>`;
}

// レッスン名からのヌメロ自動判定（表示時のみ／保存データは変更しない）
const NUMERO_NAMES = Object.keys(NUMERO_COLORS).sort((a,b)=>b.length-a.length);
function detectNumeroFromText(text){
  if(!text) return '';
  const matches = NUMERO_NAMES.filter(name => text.includes(name));
  if(matches.length === 0) return '';
  const longest = matches[0];
  const sameLength = matches.filter(name => name.length === longest.length);
  return sameLength.length === 1 ? longest : '';
}
function resolveLessonNumero(lesson){
  if(!lesson) return '';
  if(lesson.numero) return lesson.numero;
  return detectNumeroFromText(lesson.content);
}

// 絞り込みは「そのレッスン自身のヌメロ」だけで判定します。
// チャプター・課題・自主練メモに別ヌメロ名が書かれていても、
// それを理由に別ヌメロの一覧へ混ざらないようにします。
const NUMERO_ALIASES = {
  "カンティーニャ": ["カンティーニャ"],
  "アレグリ・ソロパート": ["アレグリ・ソロパート", "アレグリアス", "アレグリア"],
  "グアヒーラソロ": ["グアヒーラソロ", "グアヒーラ", "グアヒラ"],
  "ファルーカ": ["ファルーカ"],
  "ファンタンゴ": ["ファンタンゴ", "ファンダンゴ"],
  "セビジャーナス": ["セビジャーナス", "セビジャーナ"],
  "パルマ": ["パルマ"],
  "集中パルマ": ["集中パルマ"],
  "タンゴ": ["タンゴ"],
  "ブレリア": ["ブレリア"],
  "その他": ["その他"]
};

function lessonMatchesNumero(lesson, numero){
  if(!numero) return true;
  if(!lesson) return false;

  // 保存済みnumeroを最優先。未設定の過去データだけレッスン名から判定。
  const lessonNumero = resolveLessonNumero(lesson);
  if(!lessonNumero) return false;

  const aliases = NUMERO_ALIASES[numero] || [numero];
  return aliases.includes(lessonNumero);
}

// 新規登録・通常編集は現在の一覧だけ。過去の値を編集中だけ一時表示します。
function populateNumeroSelect(selectId, selectedValue){
  const sel = $(selectId);
  if(!sel) return;
  const opts = [];
  const isCurrent = NUMERO_SELECT_OPTIONS.includes(selectedValue);
  if(selectedValue && !isCurrent){
    opts.push(`<option value="${escapeHtml(selectedValue)}" selected>${escapeHtml(selectedValue)}（過去データ）</option>`);
  }else{
    opts.push(`<option value="" ${selectedValue ? '' : 'selected'}>選択してください</option>`);
  }
  NUMERO_SELECT_OPTIONS.forEach(k=>{
    opts.push(`<option value="${escapeHtml(k)}" ${k===selectedValue?'selected':''}>${escapeHtml(numeroDisplayLabel(k))}</option>`);
  });
  sel.innerHTML = opts.join('');
}

const $ = (id) => document.getElementById(id);

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }

function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

async function loadState(){
  try{
    await signInAndWait();
    await ensureSeedDataIfNeeded();
    subscribeToFirestore();
    subscribeToDirectIssues();
    subscribeToGeneralNotes();
  }catch(e){
    console.error(e);
    showToast('Firebaseに接続できませんでした。設定をご確認ください');
    lessons = seedData();
    render();
  }
}

function signInAndWait(){
  return new Promise((resolve, reject)=>{
    auth.onAuthStateChanged(user=>{
      if(user) resolve(user);
    }, reject);
    auth.signInAnonymously().catch(reject);
  });
}

// アプリを初めて開いた時（データが1件もない時）だけ、サンプルのレッスンを2件登録します。
// 一度サンプルを入れた（または既にレッスンがある）ことを記録しておき、
// レッスンを全部削除した後に再度サンプルが復活してしまわないようにしています。
async function ensureSeedDataIfNeeded(){
  const metaSnap = await metaDocRef.get();
  if(metaSnap.exists) return;

  const existing = await lessonsCollection.limit(1).get();
  if(existing.empty){
    const seed = seedData();
    const batch = db.batch();
    seed.forEach(l=>{
      const { id, ...data } = l;
      batch.set(lessonsCollection.doc(id), data);
    });
    await batch.commit();
  }
  await metaDocRef.set({ seededAt: firebase.firestore.FieldValue.serverTimestamp() });
}

function subscribeToFirestore(){
  if(unsubscribeSnapshot) unsubscribeSnapshot();
  unsubscribeSnapshot = lessonsCollection.onSnapshot((snap)=>{
    lessons = snap.docs.map(doc=> ({ id: doc.id, ...doc.data() }));
    render();
  }, (err)=>{
    console.error(err);
    showToast('データの読み込みに失敗しました');
  });
}
function subscribeToDirectIssues(){
  if(unsubscribeDirectIssuesSnapshot) unsubscribeDirectIssuesSnapshot();
  unsubscribeDirectIssuesSnapshot = directIssuesCollection.onSnapshot((snap)=>{
    directIssues = snap.docs.map(doc=> ({ id: doc.id, ...doc.data() }));
    render();
  }, (err)=>{
    console.error(err);
    showToast('直接課題の読み込みに失敗しました');
  });
}
// 「フラメンコ全体メモ」のリアルタイム購読（レッスンとは別のコレクション）
function subscribeToGeneralNotes(){
  if(unsubscribeNotesSnapshot) unsubscribeNotesSnapshot();
  unsubscribeNotesSnapshot = generalNotesCollection.onSnapshot((snap)=>{
    generalNotes = snap.docs.map(doc=> ({ id: doc.id, ...doc.data() }));
    render();
  }, (err)=>{
    console.error(err);
    showToast('全体メモの読み込みに失敗しました');
  });
}

// 指定した全体メモ（noteId）の現在の内容を、そのメモ専用のドキュメントに保存します。
async function persistNote(noteId){
  if(!noteId) return;
  const n = generalNotes.find(x=>x.id===noteId);
  if(!n) return;
  try{
    const { id, ...data } = n;
    await generalNotesCollection.doc(noteId).set({
      ...data,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){
    console.error(e);
    showToast('保存に失敗しました（通信をご確認ください）');
  }
}

// 指定したレッスン（lessonId）の現在の内容を、そのレッスン専用のドキュメントに保存します。
async function persist(lessonId){
  if(!lessonId) return;
  const l = findLesson(lessonId);
  if(!l) return;
  try{
    const { id, ...data } = l;
    await lessonsCollection.doc(lessonId).set({
      ...data,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){
    console.error(e);
    showToast('保存に失敗しました（通信をご確認ください）');
  }
}

$('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

function setLessonNumeroFilter(value){
  lessonNumeroFilter = value || '';
  expandedId = null;
  render();
}

function matchesSearch(lesson){
  if(!searchTerm) return true;
  const hay = [
    lesson.date, lesson.content, lesson.nextGoals, lesson.numero,
    ...(lesson.chapters||[]).map(c=>c.label),
    ...(lesson.issues||[]).map(i=>i.text),
    ...(lesson.practiceLog||[]).map(p=>p.note)
  ].join(' ').toLowerCase();
  return hay.includes(searchTerm);
}

function matchesNoteSearch(note){
  if(!searchTerm) return true;
  return (note.date + ' ' + note.content + ' ' + (note.numero||'')).toLowerCase().includes(searchTerm);
}

function timeToSeconds(t){
  if(!t) return 0;
  const parts = t.split(':').map(n=>parseInt(n,10)||0);
  if(parts.length===3) return parts[0]*3600+parts[1]*60+parts[2];
  if(parts.length===2) return parts[0]*60+parts[1];
  return parts[0]||0;
}

function buildYoutubeLink(url, time){
  if(!url) return null;
  const sec = timeToSeconds(time);
  const sep = url.includes('?') ? '&' : '?';
  return sec>0 ? `${url}${sep}t=${sec}s` : url;
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatDateJp(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return dateStr;
  const days = ['日','月','火','水','木','金','土'];
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} (${days[d.getDay()]})`;
}

function render(){
  updateIssueBadge();
  const main = $('mainContent');
  if(currentTab === 'issues'){
    main.innerHTML = renderIssuesBoard();
  }else if(currentTab === 'notes'){
    main.innerHTML = renderNotesList();
  }else{
    main.innerHTML = renderLessonsList();
  }
}

function updateIssueBadge(){
  const lessonCount = lessons.reduce((acc,l)=> acc + (l.issues||[]).filter(i=>!i.resolved).length, 0);
  const directCount = directIssues.filter(i=>!i.resolved).length;
  const count = lessonCount + directCount;
  const badge = $('issueCountBadge');
  if(count>0){ badge.style.display='inline-block'; badge.textContent = count; }
  else{ badge.style.display='none'; }
}

function renderIssuesBoard(){
  const openIssues = [];
  lessons.forEach(l=>{
    (l.issues||[]).forEach(i=>{
      if(!i.resolved) openIssues.push({ kind:'lesson', id:i.id, text:i.text, date:l.date, lesson:l });
    });
  });
  directIssues.forEach(i=>{
    if(!i.resolved) openIssues.push({ kind:'direct', id:i.id, text:i.text, date:i.date||'', numero:i.numero||'' });
  });

  const filtered = openIssues.filter(it=>{
    if(!searchTerm) return true;
    const hay = it.kind==='lesson'
      ? (it.text + ' ' + it.lesson.content + ' ' + it.lesson.date)
      : (it.text + ' ' + (it.numero||'') + ' ' + it.date);
    return hay.toLowerCase().includes(searchTerm);
  });
  filtered.sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  if(filtered.length===0){
    return `<div class="empty-state">
      <p class="big">まだ未解決の課題はありません</p>
      <p>レッスンで注意された点を記録すると、ここに一覧されます。</p>
    </div>`;
  }

  return filtered.map(it=>{
    if(it.kind==='lesson'){
      const link = buildYoutubeLink(it.lesson.youtubeUrl, it.matchTime||'');
      const color = numeroColor(resolveLessonNumero(it.lesson));
      return `
      <div class="issue-card" style="border-left-color:${color};">
        <div class="issue-meta">
          <span>${formatDateJp(it.lesson.date)}</span>
          <span class="issue-lesson-name">${escapeHtml(it.lesson.content)}</span>
        </div>
        ${numeroChipHtml(resolveLessonNumero(it.lesson))}
        <p class="issue-text">${escapeHtml(it.text)}</p>
        <div class="issue-actions">
          <button class="btn btn-gold" onclick="toggleIssue('${it.lesson.id}','${it.id}')">✓ 直った</button>
          ${it.lesson.youtubeUrl ? `<a class="btn btn-ghost" style="text-decoration:none;" href="${escapeHtml(link)}" target="_blank" rel="noopener">▶ 動画で確認</a>` : ''}
          <button class="btn btn-ghost" onclick="expandedId='${it.lesson.id}'; switchTab('lessons');">レッスンを見る</button>
        </div>
      </div>`;
    }else{
      const color = numeroColor(it.numero);
      return `
      <div class="issue-card" style="border-left-color:${color};">
        <div class="issue-meta">
          <span>${formatDateJp(it.date)}</span>
          ${numeroChipHtml(it.numero)}
        </div>
        <p class="issue-text">${escapeHtml(it.text)}</p>
        <div class="issue-actions">
          <button class="btn btn-gold" onclick="toggleDirectIssue('${it.id}')">✓ 直った</button>
          <button class="btn btn-ghost" onclick="deleteDirectIssue('${it.id}')">削除</button>
        </div>
      </div>`;
    }
  }).join('');
}

function renderLessonsList(){
  const options = ['<option value="">すべて</option>']
    .concat(NUMERO_SELECT_OPTIONS.map(numero=>
      `<option value="${escapeHtml(numero)}" ${lessonNumeroFilter===numero?'selected':''}>${escapeHtml(numeroDisplayLabel(numero))}</option>`
    )).join('');

  const filterUi = `
    <div class="lesson-filter-wrap">
      <label class="lesson-filter-label" for="lessonNumeroFilter">ヌメロで絞り込み</label>
      <select id="lessonNumeroFilter" class="lesson-filter-select" onchange="setLessonNumeroFilter(this.value)">
        ${options}
      </select>
    </div>`;

  const filtered = lessons
    .filter(matchesSearch)
    .filter(l=> lessonMatchesNumero(l, lessonNumeroFilter))
    .slice()
    .sort((a,b)=> b.date.localeCompare(a.date));

  const reviewSummary = lessonNumeroFilter
    ? `<div class="lesson-filter-summary"><strong>${escapeHtml(lessonNumeroFilter)}</strong> のレッスンを ${filtered.length}件 まとめて表示しています。下に過去分まで一覧表示します。必要なレッスンだけタップして開けます。</div>`
    : '';

    const hasAnyLessons = lessons.length>0;
    return filterUi + reviewSummary + `<div class="empty-state">
      <p class="big">${hasAnyLessons ? '該当するレッスンがありません' : 'レッスンがまだ登録されていません'}</p>
      <p>${hasAnyLessons ? 'このヌメロとして登録・判定されたレッスンはありません。' : '右下の＋ボタンから最初のレッスンを追加しましょう。'}</p>

  }
  // 絞り込み時もカードは閉じた状態で一覧表示。必要なレッスンだけタップして開く。
  return filterUi + reviewSummary + filtered.map(l=>renderLessonCard(l, false)).join('');

function toggleExpand(id){
  expandedId = (expandedId === id) ? null : id;
  render();
}

function findLesson(id){ return lessons.find(l=>l.id===id); }

function openChapter(lessonId, chapterId){
  const l = findLesson(lessonId);
  const c = (l.chapters||[]).find(c=>c.id===chapterId);
  if(!l.youtubeUrl){ showToast('この レッスンには動画リンクがありません'); return; }
  const link = buildYoutubeLink(l.youtubeUrl, c.time);
  window.open(link, '_blank');
}

async function addChapter(lessonId){
  const l = findLesson(lessonId);
  const time = $(`newTime-${lessonId}`).value.trim();
  const label = $(`newChLabel-${lessonId}`).value.trim();
  if(!label){ showToast('内容を入力してください'); return; }
  l.chapters = l.chapters || [];
  l.chapters.push({id: uid(), time: time || '0:00', label});
  l.chapters.sort((a,b)=> timeToSeconds(a.time) - timeToSeconds(b.time));
  await persist(lessonId);
  render();
}

function toggleBulkChapter(lessonId){
  const wrap = $(`bulkWrap-${lessonId}`);
  wrap.style.display = (wrap.style.display === 'none') ? 'block' : 'none';
}

async function bulkAddChapters(lessonId){
  const l = findLesson(lessonId);
  const raw = $(`bulkChapters-${lessonId}`).value;
  const lines = raw.split('\n').map(s=>s.trim()).filter(Boolean);
  if(lines.length===0){ showToast('チャプターを入力してください'); return; }
  l.chapters = l.chapters || [];
  lines.forEach(line=>{
    const m = line.match(/^(\d{1,2}(?::\d{2}){1,2})\s+(.+)$/);
    if(m){
      l.chapters.push({id: uid(), time: m[1], label: m[2].trim()});
    }else{
      l.chapters.push({id: uid(), time:'0:00', label: line});
    }
  });
  l.chapters.sort((a,b)=> timeToSeconds(a.time) - timeToSeconds(b.time));
  await persist(lessonId);
  render();
  showToast(`${lines.length}件のチャプターを追加しました`);
}

async function deleteChapter(lessonId, chapterId){
  const l = findLesson(lessonId);
  l.chapters = (l.chapters||[]).filter(c=>c.id!==chapterId);
  await persist(lessonId);
  render();
}

async function addIssue(lessonId){
  const l = findLesson(lessonId);
  const input = $(`newIssue-${lessonId}`);
  const text = input.value.trim();
  if(!text){ showToast('内容を入力してください'); return; }
  l.issues = l.issues || [];
  l.issues.push({id: uid(), text, resolved:false});
  await persist(lessonId);
  render();
}

async function toggleIssue(lessonId, issueId){
  const l = findLesson(lessonId);
  const issue = (l.issues||[]).find(i=>i.id===issueId);
  issue.resolved = !issue.resolved;
  await persist(lessonId);
  render();
  showToast(issue.resolved ? '課題を解決済みにしました' : '未解決に戻しました');
}

async function deleteIssue(lessonId, issueId){
  const l = findLesson(lessonId);
  l.issues = (l.issues||[]).filter(i=>i.id!==issueId);
  await persist(lessonId);
  render();
}

async function saveGoals(lessonId){
  const l = findLesson(lessonId);
  l.nextGoals = $(`goals-${lessonId}`).value;
  await persist(lessonId);
}

async function addLog(lessonId){
  const l = findLesson(lessonId);
  const date = $(`newLogDate-${lessonId}`).value || todayStr();
  const note = $(`newLogNote-${lessonId}`).value.trim();
  if(!note){ showToast('練習内容を入力してください'); return; }
  l.practiceLog = l.practiceLog || [];
  l.practiceLog.push({id: uid(), date, note});
  await persist(lessonId);
  render();
  showToast('練習記録を追加しました');
}

async function deleteLog(lessonId, logId){
  const l = findLesson(lessonId);
  l.practiceLog = (l.practiceLog||[]).filter(p=>p.id!==logId);
  await persist(lessonId);
  render();
}

function openAddModal(){
  if(currentTab === 'issues'){
    openDirectIssueModal();
  }else if(currentTab === 'notes'){
    openNoteModal();
  }else{
    openLessonModal();
  }
}
function openDirectIssueModal(){
  $('fldDirectIssueDate').value = todayStr();
  $('fldDirectIssueText').value = '';
  populateNumeroSelect('fldDirectIssueNumero', '');
  $('directIssueModalOverlay').classList.remove('hidden');
}

function closeDirectIssueModal(){
  $('directIssueModalOverlay').classList.add('hidden');
}

async function saveDirectIssue(){
  const date = $('fldDirectIssueDate').value;
  const numero = $('fldDirectIssueNumero').value;
  const text = $('fldDirectIssueText').value.trim();

  if(!text){
    showToast('課題を入力してください');
    return;
  }

  const ref = directIssuesCollection.doc();
  await ref.set({
    date,
    numero,
    text,
    resolved: false,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  closeDirectIssueModal();
  showToast('課題を追加しました');
}

async function toggleDirectIssue(issueId){
  const issue = directIssues.find(i=>i.id===issueId);
  if(!issue) return;
  try{
    await directIssuesCollection.doc(issueId).update({ resolved: !issue.resolved });
    showToast(!issue.resolved ? '課題を解決済みにしました' : '未解決に戻しました');
  }catch(e){
    console.error(e);
    showToast('更新に失敗しました（通信をご確認ください）');
  }
}

async function deleteDirectIssue(issueId){
  try{
    await directIssuesCollection.doc(issueId).delete();
    showToast('削除しました');
  }catch(e){
    console.error(e);
    showToast('削除に失敗しました（通信をご確認ください）');
  }
}

function openLessonModal(){
  editingLessonId = null;
  $('lessonModalTitle').textContent = '新しいレッスン';
  $('fldDate').value = todayStr();
  $('fldContent').value = '';
  $('fldYoutube').value = '';
  populateNumeroSelect('fldNumero', '');
  $('lessonModalOverlay').classList.remove('hidden');
}

function editLesson(id){
  const l = findLesson(id);
  editingLessonId = id;
  $('lessonModalTitle').textContent = 'レッスンを編集';
  $('fldDate').value = l.date;
  $('fldContent').value = l.content;
  $('fldYoutube').value = l.youtubeUrl || '';
  populateNumeroSelect('fldNumero', l.numero || '');
  $('lessonModalOverlay').classList.remove('hidden');
}

function closeLessonModal(){
  $('lessonModalOverlay').classList.add('hidden');
}

async function saveLessonModal(){
  const date = $('fldDate').value;
  const content = $('fldContent').value.trim();
  const youtubeUrl = $('fldYoutube').value.trim();
  const numero = $('fldNumero').value;
  if(!date || !content){ showToast('日付と内容を入力してください'); return; }

  let targetId;
  if(editingLessonId){
    const l = findLesson(editingLessonId);
    l.date = date; l.content = content; l.youtubeUrl = youtubeUrl; l.numero = numero;
    targetId = editingLessonId;
  }else{
    const newLesson = {
      id: uid(), date, content, youtubeUrl, numero,
      chapters:[], issues:[], nextGoals:'', practiceLog:[]
    };
    lessons.push(newLesson);
    expandedId = newLesson.id;
    currentTab = 'lessons';
    $('tabIssues').classList.remove('active');
    $('tabLessons').classList.add('active');
    targetId = newLesson.id;
  }
  await persist(targetId);
  closeLessonModal();
  render();
  showToast('レッスンを保存しました');
}

async function deleteLesson(id){
  if(!confirm('このレッスンを削除しますか？記録した内容もすべて削除されます。')) return;
  try{
    await lessonsCollection.doc(id).delete();
  }catch(e){
    console.error(e);
    showToast('削除に失敗しました（通信をご確認ください）');
    return;
  }
  if(expandedId===id) expandedId = null;
  showToast('削除しました');
}

function openNoteModal(){
  editingNoteId = null;
  $('noteModalTitle').textContent = '新しい全体メモ';
  $('fldNoteDate').value = todayStr();
  $('fldNoteContent').value = '';
  populateNumeroSelect('fldNoteNumero', '');
  $('noteModalOverlay').classList.remove('hidden');
}

function editNote(id){
  const n = generalNotes.find(x=>x.id===id);
  if(!n) return;
  editingNoteId = id;
  $('noteModalTitle').textContent = '全体メモを編集';
  $('fldNoteDate').value = n.date;
  $('fldNoteContent').value = n.content;
  populateNumeroSelect('fldNoteNumero', n.numero || '');
  $('noteModalOverlay').classList.remove('hidden');
}

function closeNoteModal(){
  $('noteModalOverlay').classList.add('hidden');
}

async function saveNoteModal(){
  const date = $('fldNoteDate').value;
  const content = $('fldNoteContent').value.trim();
  const numero = $('fldNoteNumero').value;
  if(!date || !content){ showToast('日付と内容を入力してください'); return; }

  let targetId;
  if(editingNoteId){
    const n = generalNotes.find(x=>x.id===editingNoteId);
    n.date = date; n.content = content; n.numero = numero;
    targetId = editingNoteId;
  }else{
    const newNote = { id: uid(), date, content, numero };
    generalNotes.push(newNote);
    targetId = newNote.id;
  }
  await persistNote(targetId);
  closeNoteModal();
  render();
  showToast('全体メモを保存しました');
}

async function deleteNote(id){
  if(!confirm('この全体メモを削除しますか？')) return;
  try{
    await generalNotesCollection.doc(id).delete();
  }catch(e){
    console.error(e);
    showToast('削除に失敗しました（通信をご確認ください）');
    return;
  }
  showToast('削除しました');
}

loadState();
</script>
</body>
</html>
