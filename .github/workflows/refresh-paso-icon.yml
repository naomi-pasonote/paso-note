name: Refresh Paso Note iPhone icon

on:
  push:
    paths:
      - ".github/workflows/refresh-paso-icon.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract latest embedded Paso Note icon
        shell: python
        run: |
          from pathlib import Path
          import base64, json, re

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")

          m = re.search(r'<link rel="apple-touch-icon"[^>]*href="data:image/png;base64,([^"]+)"', html)
          if not m:
              raise SystemExit("Embedded latest Paso Note icon was not found.")

          icon_name = "paso-icon-latest-20260922.png"
          Path(icon_name).write_bytes(base64.b64decode(m.group(1)))

          # iPhone must receive a real file URL, not a data: URL.
          html = re.sub(
              r'<link rel="apple-touch-icon"[^>]*>',
              f'<link rel="apple-touch-icon" sizes="180x180" href="{icon_name}">',
              html,
              count=1,
          )
          index_path.write_text(html, encoding="utf-8")

          manifest_path = Path("manifest.json")
          raw_manifest = manifest_path.read_text(encoding="utf-8").strip()
          if raw_manifest.endswith("\\n"):
              raw_manifest = raw_manifest[:-2]
          manifest = json.loads(raw_manifest)
          manifest["icons"] = [{
              "src": icon_name,
              "sizes": "180x180",
              "type": "image/png",
              "purpose": "any"
          }]
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

      - name: Commit refreshed icon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.json paso-icon-latest-20260922.png
          git commit -m "Use latest Paso Note icon on iPhone"
          git push
