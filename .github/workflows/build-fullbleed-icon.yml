name: Build full-bleed Paso Note icon

on:
  push:
    paths:
      - ".github/workflows/build-fullbleed-icon.yml"

permissions:
  contents: write

jobs:
  build-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create borderless full-bleed icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          import numpy as np, json, pathlib, re

          src_path = pathlib.Path("paso-icon-latest-20260922.png")
          im = Image.open(src_path).convert("RGB")
          w, h = im.size
          side = min(w, h)
          left = (w-side)//2
          top = (h-side)//2
          im = im.crop((left, top, left+side, top+side))

          # Remove the old white rim while keeping the exact Paso Note artwork.
          margin = max(5, round(side * 0.035))
          im = im.crop((margin, margin, side-margin, side-margin))
          arr = np.array(im).copy()
          h, w = arr.shape[:2]

          # The old asset was already rounded. Extend the real artwork into those
          # corner pixels so iOS can apply its own rounded mask without a white rim.
          r = max(18, round(min(w,h) * 0.15))
          inset = max(6, round(min(w,h) * 0.045))
          target_r = max(2, r-inset)

          for y in range(h):
              for x in range(w):
                  if x < r and y < r:
                      cx, cy = r-1, r-1
                  elif x >= w-r and y < r:
                      cx, cy = w-r, r-1
                  elif x < r and y >= h-r:
                      cx, cy = r-1, h-r
                  elif x >= w-r and y >= h-r:
                      cx, cy = w-r, h-r
                  else:
                      continue
                  dx, dy = x-cx, y-cy
                  d = (dx*dx + dy*dy) ** 0.5
                  if d > target_r and d > 0:
                      sx = int(round(cx + dx/d * target_r))
                      sy = int(round(cy + dy/d * target_r))
                      sx = max(0, min(w-1, sx))
                      sy = max(0, min(h-1, sy))
                      arr[y, x] = arr[sy, sx]

          full = Image.fromarray(arr)
          outputs = {
              "paso-icon-fullbleed-20260922.png": 180,
              "icon-192-fullbleed.png": 192,
              "icon-512-fullbleed.png": 512,
          }
          for name, size in outputs.items():
              full.resize((size,size), Image.Resampling.LANCZOS).save(name, optimize=True)

          manifest_path = pathlib.Path("manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["icons"] = [
              {"src":"icon-192-fullbleed.png?v=2","sizes":"192x192","type":"image/png","purpose":"any maskable"},
              {"src":"icon-512-fullbleed.png?v=2","sizes":"512x512","type":"image/png","purpose":"any maskable"}
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")

          index_path = pathlib.Path("index.html")
          text = index_path.read_text(encoding="utf-8")
          text = re.sub(
              r'<link rel="apple-touch-icon"[^>]*>',
              '<link rel="apple-touch-icon" sizes="180x180" href="paso-icon-fullbleed-20260922.png?v=2">',
              text
          )
          index_path.write_text(text, encoding="utf-8")
          PY
      - name: Commit full-bleed icon
        run: |
          git config user.name "naomi-pasonote"
          git config user.email "325325483+naomi-pasonote@users.noreply.github.com"
          git add paso-icon-fullbleed-20260922.png icon-192-fullbleed.png icon-512-fullbleed.png manifest.json index.html
          git commit -m "Use full-bleed Paso Note icon without white rim"
          git push
